[project]

site_name = "Abiotic Extended Docs"
site_description = "Modding docs for Abiotic Factor."
site_author = "ABE"
copyright = "Copyright &copy; 2026 Abiotic Factor Modding Community. Licensed under Creative Commons BY-SA 4.0"

extra_css = ["stylesheets/extra.css"]
#extra_javascript = ["javascripts/extra.js"]

# The site_url is the canonical URL for your site. When building online
# documentation you should set this.
site_url = "https://abioticextended.github.io/docs/"

repo_url = "https://github.com/AbioticExtended/docs"
repo_name = "AbioticExtended/docs"

